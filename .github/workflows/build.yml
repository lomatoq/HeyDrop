name: Build HeyDrop for itch
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: python3 package-release.py
      - uses: actions/upload-artifact@v7
        with:
          name: HeyDrop-itch
          path: dist/HeyDrop-V17-itch.zip
          if-no-files-found: error
